{% extends 'base.html' %}

{% block title %}Password Reset Complete | PlaceSync{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <h1 class="auth-title">Password Reset Complete</h1>
            <p class="auth-subtitle" style="margin-top: 1rem; line-height: 1.6;">
                Your password has been reset successfully. You can now use your new password to log in.
            </p>
        </div>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Log In</a>
    </div>
</div>
{% endblock %}
