<div class="sp-card" style="margin-bottom:0; transition:var(--t); border-top: 3px solid 
  {% if event.event_type == 'DEADLINE' %}#f43f5e
  {% elif event.event_type == 'APTITUDE_TEST' %}#06b6d4
  {% elif event.event_type == 'TECH_INTERVIEW' %}#7c3aed
  {% elif event.event_type == 'HR_INTERVIEW' %}#10b981
  {% elif event.event_type == 'OFFER_RELEASE' %}#fbbf24
  {% elif event.event_type == 'JOINING_DATE' %}#6366f1
  {% else %}var(--border){% endif %};">

  <div class="sp-card-body" style="padding:1rem;">
    <!-- Badges Row -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;">
      <span class="sp-badge 
        {% if event.event_type == 'DEADLINE' %}sxp-badge-danger
        {% elif event.event_type == 'APTITUDE_TEST' %}sp-badge-sky
        {% elif event.event_type == 'TECH_INTERVIEW' %}sp-badge-violet
        {% elif event.event_type == 'HR_INTERVIEW' %}sp-badge-green
        {% elif event.event_type == 'OFFER_RELEASE' %}sp-badge-amber
        {% elif event.event_type == 'JOINING_DATE' %}sp-badge-indigo
        {% else %}sp-badge-gray{% endif %}" style="font-size:.65rem;padding:.15rem .45rem;">
        {{ event.get_event_type_display }}
      </span>
      <span style="font-size:.7rem;color:var(--txt-3);font-weight:700;">{{ event.event_date|date:"d M Y" }}</span>
    </div>

    <!-- Title and details -->
    <h5 style="font-size:.875rem;font-weight:700;color:#fff;margin-bottom:.25rem;">{{ event.title }}</h5>
    <div style="font-size:.76rem;color:#c4b5fd;font-weight:600;margin-bottom:.5rem;">
      {{ event.drive.company.name }} · <span style="color:var(--txt-2);">{{ event.drive.role }}</span>
    </div>

    <!-- Description -->
    <p
      style="font-size:.74rem;color:var(--txt-3);line-height:1.45;margin:0;border-top:1px solid rgba(255,255,255,.02);padding-top:.45rem;">
      {{ event.description }}
    </p>

    <!-- Details redirection link -->
    <div style="margin-top:.625rem;text-align:right;">
      <a href="{% url 'student_portal:drive_detail' event.drive.pk %}"
        style="font-size:.68rem;color:#c4b5fd;text-decoration:none;font-weight:600;">View Drive Details →</a>
    </div>
  </div>
</div>
